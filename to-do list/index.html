<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      /* outline: 1px solid orangered; */
    }
    html,
    body {
      font-family: lexend;
      background-color: rgb(0, 0, 0);
    }

    header {
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
    }
    h1 {
      width: 100%;
      margin: 1rem;
      padding: 1rem;
      text-align: center;
      color: rgba(236, 229, 229, 0.722);
      border-bottom: 2px solid grey;
    }
    input {
      padding: 2rem;
      color: rgb(212, 31, 31);
    }

    .form-item button {
      background: none;
      border: none;
      padding: 0;
      margin-left: auto;
      cursor: pointer;
      font-size: 20px;
    }
    .icon {
      color: rgb(114, 96, 96);
    }
    .form-item button i {
      font-size: 20px;
      transition: 0.2s;
    }

    .icon:hover {
      color: red;
      transform: scale(1.2);
      transition: all 0.2s ease;
    }
    label {
      height: 65px;
      gap: 1.2rem;
      padding: 1.2rem 0.4rem;
      text-align: center;
      color: white;
      display: flex;
      align-items: center;
      font-size: 20px;
      text-align: left;
      min-width: 600px;
      outline: 1px solid rgb(73, 72, 72);
    }

    label:has(input:checked) {
      text-decoration: line-through;
      filter: grayscale(65%) blur(1px);
      opacity: 0.5;
      .icon {
        color: rgb(255, 15, 15);
      }
    }

    form {
      margin: 0.6rem 6rem;
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;

      /* mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 8%,
                black 92%,
                transparent 100%
              ); */
    }

    ::-webkit-scrollbar {
      width: 3px;
    }

    ::-webkit-scrollbar-track {
      background: #0c0c0c75;
    }

    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 5px;
    }

    .addBtn {
      padding: 12px 20px;
      background-color: rgb(79, 79, 79);
      color: rgba(235, 235, 235, 0.878);
      font-size: 16px;
      font-weight: bold;
      border: 1px solid rgb(159, 158, 158);
      border-radius: 20px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .addBtn:hover {
      background-color: #777;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    .form-wrapper {
      max-width: 800px;
      height: 700px;
      margin: 2rem 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* justify-content: center; */
      overflow-y: scroll;
      overflow-x: hidden;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .form-item {
      display: flex;
      max-width: 450px;
      word-break: normal;
      overflow-wrap: break-word;
      height: auto;
      align-items: center;
      overflow-x: scroll;
      overflow-y: hidden;
      justify-content: space-between;
      transition: transform 0.1s ease-in;
    }
    .form-item:hover {
      transform: translateX(12px);
      background-color: #3a3939;
    }

    /*---------modal----------*/

    .modal {
      color: #888;
      z-index: 1000;
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      z-index: 999;
    }

    .modal-show {
      display: flex;
    }

    .modal-content {
      background-color: rgb(31, 30, 30);
      display: flex;
      width: 480px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4rem;
      border: 1px solid rgba(72, 71, 71, 0.462);
      padding: 1.6rem;
      border-radius: 10px;
    }

    .modal-content h2 {
      color: rgb(202, 197, 197);
    }
    .modal-content input {
      background-color: #555454;
      color: rgba(240, 240, 240, 0.849);
      font-size: 20px;
      width: 400px;
      height: 100px;
      border: none;
      border-radius: 10px;
    }

    .modal-content input::placeholder {
      color: rgb(202, 197, 197);
    }
    .modal-content input:focus {
      border: none;
      outline: none;
      caret-color: #fdfeff;
    }
    .btn-container {
      display: flex;
      gap: 2.7rem;
      padding: 0.6rem;
    }

    .btn-container button {
      padding: 12px 30px;
      font-size: 1.08rem;
      border: none;
      border-radius: 10px;
      color: white;
    }
    #modal-close {
      background-color: #4e4d4d;
      transition: all 0.2s ease-in;
    }
    #modal-close:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 8px rgba(124, 121, 121, 0.5);
      cursor: pointer;
    }

    #modal-add {
      background-color: rgba(210, 43, 43, 0.878);
      transition: all 0.2s ease-in;
    }
    #modal-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgb(170, 8, 8);
      cursor: pointer;
    }

    .red-shadow {
      box-shadow: 0 0 20px rgb(170, 8, 8);
    }
    .white-shadow {
      box-shadow: 0 0 8px rgba(124, 121, 121, 0.5);
    }
    .text-shadow {
      text-shadow: 0 0 3px rgb(117, 115, 115);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #222;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(-20px);
      transition: 0.3s;
      z-index: 10000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(1);
    }
  </style>
  <body>
    <header>
      <h1>To do List</h1>
      <button class="addBtn">+Add Task</button>
    </header>

    <main>
      <div class="form-wrapper">
        <div id="form">
          <!-- tasks -->
        </div>
      </div>
    </main>

    <section>
      <form class="task-form"></form>
      <div class="modal">
        <div class="modal-container">
          <form class="modal-content" id="task-form">
            <h2 class="text-shadow">Add Task</h2>

            <input
              id="task-input"
              suggestions="off"
              type="text"
              placeholder="Enter Your Task"
            />

            <div class="btn-container">
              <button type="submit" id="modal-add">Create</button>
              <button type="button" id="modal-close">Close</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
  </body>
</html>
